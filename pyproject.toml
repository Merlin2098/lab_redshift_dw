[project]
name = "lab-redshift-dw"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "boto3==1.35.49",
    "python-dotenv==1.2.2",
]

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "ruff==0.15.12",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "cloud: tests that require live AWS credentials and a deployed lab (skipped without them)",
]

[tool.uv]
package = false
